<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart | Marka_clothing</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .cart-page {
            padding: 140px 8% 80px;
            min-height: 70vh;
        }

        .cart-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .cart-title h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .cart-title p {
            color: #777;
        }

        .cart-container {
            max-width: 1000px;
            margin: auto;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 25px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item img {
            width: 120px;
            height: 150px;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .cart-item-price {
            font-weight: 600;
        }

        .remove-btn {
            background: none;
            border: 1px solid #111;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .remove-btn:hover {
            background: #111;
            color: white;
        }

        .cart-summary {
            max-width: 1000px;
            margin: 40px auto 0;
            display: flex;
            justify-content: flex-end;
        }

        .summary-box {
            width: 350px;
            border: 1px solid #ddd;
            padding: 30px;
        }

        .summary-box h2 {
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .summary-total {
            border-top: 1px solid #ddd;
            padding-top: 20px;
            margin-top: 20px;
            font-size: 20px;
            font-weight: 700;
        }

        .checkout-btn {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            background: #111;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .checkout-btn:hover {
            background: #333;
        }

        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #111;
            text-decoration: underline;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart h2 {
            margin-bottom: 15px;
        }

        .empty-cart a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #111;
            color: white;
            text-decoration: none;
        }

        @media (max-width: 650px) {
            .cart-page {
                padding: 120px 5% 60px;
            }

            .cart-title h1 {
                font-size: 32px;
            }

            .cart-item {
                gap: 15px;
            }

            .cart-item img {
                width: 90px;
                height: 120px;
            }

            .cart-item-info h3 {
                font-size: 16px;
            }

            .remove-btn {
                padding: 8px 10px;
                font-size: 10px;
            }

            .summary-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <header class="shop-header">
        <div class="shop-logo">
            <a href="index.html">MARKA</a>
        </div>

        <nav class="shop-nav">
            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="index.html#about">ABOUT</a>
            <a href="index.html#contact">CONTACT</a>
        </nav>

        <div class="shop-icons">
            <a href="cart.html" aria-label="Shopping bag">
                🛍
            </a>
        </div>
    </header>


    <!-- CART -->
    <main class="cart-page">

        <div class="cart-title">
            <h1>YOUR CART</h1>
            <p>Review your selected items</p>
        </div>

        <div id="cart-content">
            <!-- Cart items will appear here -->
        </div>

    </main>


    <!-- FOOTER -->
    <footer>
        <div class="footer-content">

            <div class="footer-brand">
                <h2>MARKA</h2>
                <p>Modern clothing for modern living.</p>
            </div>

            <div class="footer-links">
                <div>
                    <h4>SHOP</h4>
                    <a href="shop.html">All Products</a>
                    <a href="shop.html">T-Shirts</a>
                    <a href="shop.html">Shirts</a>
                    <a href="shop.html">Hoodies</a>
                </div>

                <div>
                    <h4>HELP</h4>
                    <a href="#">Contact</a>
                    <a href="#">Shipping</a>
                    <a href="#">Returns</a>
                    <a href="#">FAQ</a>
                </div>

                <div>
                    <h4>FOLLOW</h4>
                    <a href="#">Instagram</a>
                    <a href="#">Facebook</a>
                    <a href="#">Pinterest</a>
                </div>
            </div>

        </div>

        <div class="footer-bottom">
            <p>© 2026 Marka_clothing. All rights reserved.</p>
        </div>
    </footer>


    <!-- CART JAVASCRIPT -->
    <script>

let cart = JSON.parse(localStorage.getItem("markaCart")) || [];


// GROUP SAME PRODUCTS
function getGroupedCart() {

    const grouped = {};

    cart.forEach(item => {

        if (grouped[item.name]) {

            grouped[item.name].quantity++;

        } else {

            grouped[item.name] = {
                name: item.name,
                price: item.price,
                image: item.image,
                quantity: 1
            };

        }

    });

    return Object.values(grouped);
}


// DISPLAY CART
function displayCart() {

    const cartContent = document.getElementById("cart-content");

    const groupedCart = getGroupedCart();

    if (groupedCart.length === 0) {

        cartContent.innerHTML = `
            <div class="empty-cart">
                <h2>Your cart is empty</h2>
                <p>Looks like you haven't added anything yet.</p>

                <a href="shop.html" class="btn">
                    CONTINUE SHOPPING
                </a>
            </div>
        `;

        return;
    }


    let total = 0;

    let html = `
        <div class="cart-items">
    `;


    groupedCart.forEach((item, index) => {

        const price = parseInt(
            item.price.replace(/[₹,]/g, "")
        );

        const itemTotal = price * item.quantity;

        total += itemTotal;


        html += `
            <div class="cart-item">

                <img
                    src="${item.image}"
                    alt="${item.name}"
                >

                <div class="cart-item-info">

                    <h3>${item.name}</h3>

                    <p>${item.price}</p>


                    <div class="quantity-controls">

                        <button
                            onclick="changeQuantity(${index}, -1)">
                            −
                        </button>

                        <span>
                            ${item.quantity}
                        </span>

                        <button
                            onclick="changeQuantity(${index}, 1)">
                            +
                        </button>

                    </div>

                </div>


                <div class="cart-item-right">

                    <strong>
                        ₹${itemTotal.toLocaleString("en-IN")}
                    </strong>

                    <button
                        class="remove-btn"
                        onclick="removeItem(${index})">
                        REMOVE
                    </button>

                </div>

            </div>
        `;

    });


    html += `
        </div>

        <div class="cart-summary">

            <h2>
                Total:
                ₹${total.toLocaleString("en-IN")}
            </h2>

            <button
                class="checkout-btn"
                onclick="checkout()">
                CHECKOUT
            </button>

        </div>
    `;


    cartContent.innerHTML = html;

}


// CHANGE QUANTITY
function changeQuantity(index, change) {

    const groupedCart = getGroupedCart();

    const item = groupedCart[index];

    if (!item) return;


    if (change === 1) {

        cart.push({
            name: item.name,
            price: item.price,
            image: item.image
        });

    }


    if (change === -1) {

        const itemIndex = cart.findIndex(
            product => product.name === item.name
        );

        if (itemIndex !== -1) {

            cart.splice(itemIndex, 1);

        }

    }


    localStorage.setItem(
        "markaCart",
        JSON.stringify(cart)
    );


    displayCart();

}


// REMOVE PRODUCT
function removeItem(index) {

    const groupedCart = getGroupedCart();

    const item = groupedCart[index];

    cart = cart.filter(
        product => product.name !== item.name
    );


    localStorage.setItem(
        "markaCart",
        JSON.stringify(cart)
    );


    displayCart();

}


// CHECKOUT
function checkout() {

    alert(
        "Checkout is coming next! Your cart is ready."
    );

}


// START
displayCart();

</script>

</body>
</html>
