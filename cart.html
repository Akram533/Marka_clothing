<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Your Cart | Marka_clothing</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .cart-page {
            padding: 140px 8% 80px;
            min-height: 70vh;
        }

        .cart-title {
            text-align: center;
            margin-bottom: 50px;
        }

        .cart-title h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .cart-title p {
            color: #777;
        }

        .cart-container {
            max-width: 1000px;
            margin: auto;
        }

        .cart-item {
            display: flex;
            align-items: center;
            gap: 25px;
            padding: 25px 0;
            border-bottom: 1px solid #ddd;
        }

        .cart-item img {
            width: 120px;
            height: 150px;
            object-fit: cover;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .cart-item-price {
            font-weight: 600;
        }

        .remove-btn {
            background: none;
            border: 1px solid #111;
            padding: 10px 18px;
            cursor: pointer;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .remove-btn:hover {
            background: #111;
            color: white;
        }

        .cart-summary {
            max-width: 1000px;
            margin: 40px auto 0;
            display: flex;
            justify-content: flex-end;
        }

        .summary-box {
            width: 350px;
            border: 1px solid #ddd;
            padding: 30px;
        }

        .summary-box h2 {
            margin-bottom: 25px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .summary-total {
            border-top: 1px solid #ddd;
            padding-top: 20px;
            margin-top: 20px;
            font-size: 20px;
            font-weight: 700;
        }

        .checkout-btn {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            background: #111;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .checkout-btn:hover {
            background: #333;
        }

        .continue-shopping {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #111;
            text-decoration: underline;
        }

        .empty-cart {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-cart h2 {
            margin-bottom: 15px;
        }

        .empty-cart a {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #111;
            color: white;
            text-decoration: none;
        }

        @media (max-width: 650px) {
            .cart-page {
                padding: 120px 5% 60px;
            }

            .cart-title h1 {
                font-size: 32px;
            }

            .cart-item {
                gap: 15px;
            }

            .cart-item img {
                width: 90px;
                height: 120px;
            }

            .cart-item-info h3 {
                font-size: 16px;
            }

            .remove-btn {
                padding: 8px 10px;
                font-size: 10px;
            }

            .summary-box {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- NAVIGATION -->
    <header class="shop-header">
        <div class="shop-logo">
            <a href="index.html">MARKA</a>
        </div>

        <nav class="shop-nav">
            <a href="index.html">HOME</a>
            <a href="shop.html">SHOP</a>
            <a href="index.html#about">ABOUT</a>
            <a href="index.html#contact">CONTACT</a>
        </nav>

        <div class="shop-icons">
            <a href="cart.html" aria-label="Shopping bag">
                🛍
            </a>
        </div>
    </header>


    <!-- CART -->
    <main class="cart-page">

        <div class="cart-title">
            <h1>YOUR CART</h1>
            <p>Review your selected items</p>
        </div>

        <div id="cart-content">
            <!-- Cart items will appear here -->
        </div>

    </main>


    <!-- FOOTER -->
    <footer>
        <div class="footer-content">

            <div class="footer-brand">
                <h2>MARKA</h2>
                <p>Modern clothing for modern living.</p>
            </div>

            <div class="footer-links">
                <div>
                    <h4>SHOP</h4>
                    <a href="shop.html">All Products</a>
                    <a href="shop.html">T-Shirts</a>
                    <a href="shop.html">Shirts</a>
                    <a href="shop.html">Hoodies</a>
                </div>

                <div>
                    <h4>HELP</h4>
                    <a href="#">Contact</a>
                    <a href="#">Shipping</a>
                    <a href="#">Returns</a>
                    <a href="#">FAQ</a>
                </div>

                <div>
                    <h4>FOLLOW</h4>
                    <a href="#">Instagram</a>
                    <a href="#">Facebook</a>
                    <a href="#">Pinterest</a>
                </div>
            </div>

        </div>

        <div class="footer-bottom">
            <p>© 2026 Marka_clothing. All rights reserved.</p>
        </div>
    </footer>


    <!-- CART JAVASCRIPT -->
    <script>

        let cart = JSON.parse(localStorage.getItem("markaCart")) || [];

        function displayCart() {

            const cartContent = document.getElementById("cart-content");

            if (cart.length === 0) {

                cartContent.innerHTML = `
                    <div class="empty-cart">
                        <h2>Your cart is empty</h2>
                        <p>Add some products to your cart to get started.</p>
                        <a href="shop.html">CONTINUE SHOPPING</a>
                    </div>
                `;

                return;
            }

            let itemsHTML = "";

            cart.forEach((item, index) => {

                itemsHTML += `
                    <div class="cart-item">

                        <img src="${item.image}" alt="${item.name}">

                        <div class="cart-item-info">
                            <h3>${item.name}</h3>
                            <p class="cart-item-price">${item.price}</p>
                            <p>Quantity: 1</p>
                        </div>

                        <button
                            class="remove-btn"
                            onclick="removeItem(${index})">
                            REMOVE
                        </button>

                    </div>
                `;
            });


            let total = 0;

            cart.forEach(item => {

                const price = parseFloat(
                    item.price.replace(/[₹,]/g, "")
                );

                total += price;

            });


            cartContent.innerHTML = `

                <div class="cart-container">

                    ${itemsHTML}

                </div>

                <div class="cart-summary">

                    <div class="summary-box">

                        <h2>ORDER SUMMARY</h2>

                        <div class="summary-row">
                            <span>Items</span>
                            <span>${cart.length}</span>
                        </div>

                        <div class="summary-row summary-total">
                            <span>TOTAL</span>
                            <span>₹${total.toLocaleString("en-IN")}</span>
                        </div>

                        <button
                            class="checkout-btn"
                            onclick="checkout()">
                            PROCEED TO CHECKOUT
                        </button>

                        <a
                            href="shop.html"
                            class="continue-shopping">
                            Continue Shopping
                        </a>

                    </div>

                </div>
            `;
        }


        function removeItem(index) {

            cart.splice(index, 1);

            localStorage.setItem(
                "markaCart",
                JSON.stringify(cart)
            );

            displayCart();
        }


        function checkout() {

            alert(
                "Checkout is coming next! Your cart is ready."
            );

        }


        displayCart();

    </script>

</body>
</html>
